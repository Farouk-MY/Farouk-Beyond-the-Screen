<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#15100E"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#E8E2D8" stroke-opacity="0.12"/>
  <g transform="translate(48, 48)">
    <text x="0" y="20" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.2em" fill="#E59368">MEDICONNECT // 01.1 SYSTEM ARCHITECTURE</text>
    <text x="0" y="52" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="600" fill="#FAF8F5">Client-to-Signaling Node Flow</text>
  </g>
  <g transform="translate(80, 160)">
    <!-- Client Node -->
    <rect x="0" y="40" width="160" height="90" rx="10" fill="#1C1512" stroke="#BA5227" stroke-width="1.5"/>
    <text x="80" y="75" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#FAF8F5" text-anchor="middle">Expo / RN Client</text>
    <text x="80" y="95" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#D6CEC2" text-anchor="middle">iOS &amp; Android</text>

    <!-- Arrow 1 -->
    <path d="M165 85 H235" stroke="#BA5227" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- FastAPI Gateway -->
    <rect x="240" y="20" width="180" height="130" rx="10" fill="#1C1512" stroke="#E8E2D8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="330" y="55" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#FAF8F5" text-anchor="middle">FastAPI Gateway</text>
    <text x="330" y="75" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#BA5227" text-anchor="middle">WebSocket Signaling</text>
    <text x="330" y="95" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#D6CEC2" text-anchor="middle">JWT Verification</text>
    <text x="330" y="115" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#D6CEC2" text-anchor="middle">Pre-Triage Logic</text>

    <!-- Arrow 2 -->
    <path d="M425 85 H495" stroke="#D4AF37" stroke-width="2"/>

    <!-- Supabase Cluster -->
    <rect x="500" y="40" width="160" height="90" rx="10" fill="#1C1512" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="580" y="75" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#FAF8F5" text-anchor="middle">Supabase PG</text>
    <text x="580" y="95" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#D4AF37" text-anchor="middle">Encrypted Records</text>
  </g>
