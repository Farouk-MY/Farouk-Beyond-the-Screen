<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#15100E"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#E8E2D8" stroke-opacity="0.12"/>
  <defs>
    <pattern id="grid-lm" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FAF8F5" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#grid-lm)"/>

  <!-- Header -->
  <g transform="translate(48, 48)">
    <rect width="44" height="22" rx="4" fill="#D4AF37" fill-opacity="0.2"/>
    <text x="22" y="15" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#D4AF37" text-anchor="middle">04</text>
    <text x="56" y="15" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.2em" fill="#FAF8F5" fill-opacity="0.5">CROSS-PLATFORM MOBILE APPLICATION</text>
    
    <text x="0" y="52" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="600" letter-spacing="0.04em" fill="#FAF8F5">LinguaMate</text>
    <text x="0" y="74" font-family="'Manrope', sans-serif" font-size="13" fill="#D6CEC2" fill-opacity="0.8">Conversational Language Acquisition &amp; Speech Recognition Engine</text>
  </g>

  <!-- Mobile Dual-Surface Interface Wireframe -->
  <g transform="translate(180, 160)">
    <!-- Device 1: Conversation Screen -->
    <rect x="0" y="0" width="180" height="260" rx="20" fill="#1C1512" stroke="#E8E2D8" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="55" y="8" width="70" height="12" rx="6" fill="#0E0C0A"/>
    <!-- Top bar -->
    <rect x="18" y="32" width="70" height="10" rx="3" fill="#FAF8F5" fill-opacity="0.7"/>
    <rect x="18" y="48" width="40" height="6" rx="2" fill="#D4AF37"/>

    <!-- Speech Chat Bubbles -->
    <rect x="18" y="70" width="110" height="34" rx="8" fill="#FAF8F5" fill-opacity="0.08"/>
    <text x="28" y="90" font-family="'Manrope', sans-serif" font-size="9" fill="#FAF8F5">Bonjour, comment...</text>

    <rect x="52" y="114" width="110" height="34" rx="8" fill="#BA5227" fill-opacity="0.25" stroke="#BA5227" stroke-opacity="0.4"/>
    <text x="62" y="134" font-family="'Manrope', sans-serif" font-size="9" fill="#FAF8F5">Je m'appelle Farouk!</text>

    <rect x="18" y="158" width="110" height="34" rx="8" fill="#FAF8F5" fill-opacity="0.08"/>

    <!-- Bottom Audio Input Waveform Visualizer -->
    <rect x="18" y="206" width="144" height="36" rx="8" fill="#15100E" stroke="#D4AF37" stroke-opacity="0.3"/>
    <circle cx="36" cy="224" r="10" fill="#D4AF37"/>
    <path d="M56 224 L60 216 L64 232 L68 220 L72 228 L76 224 H150" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Central Signal Connector -->
    <path d="M195 130 H245" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="220" cy="130" r="10" fill="#1C1512" stroke="#D4AF37"/>
    <text x="220" y="133" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#D4AF37" text-anchor="middle">AI</text>

    <!-- Device 2: Phonetic Feedback & Vocabulary -->
    <rect x="260" y="0" width="180" height="260" rx="20" fill="#1C1512" stroke="#E8E2D8" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="315" y="8" width="70" height="12" rx="6" fill="#0E0C0A"/>
    <rect x="278" y="32" width="90" height="10" rx="3" fill="#FAF8F5" fill-opacity="0.7"/>
    <rect x="278" y="48" width="50" height="6" rx="2" fill="#BA5227"/>

    <!-- Pronunciation Accuracy Gauge -->
    <rect x="278" y="66" width="144" height="80" rx="8" fill="#FAF8F5" fill-opacity="0.03" stroke="#FAF8F5" stroke-opacity="0.12"/>
    <text x="350" y="96" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#D4AF37" text-anchor="middle">98.2%</text>
    <text x="350" y="120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#B5A99B" text-anchor="middle">PHONETIC ACCURACY</text>

    <!-- Vocabulary Flashcard -->
    <rect x="278" y="158" width="144" height="84" rx="8" fill="#FAF8F5" fill-opacity="0.05"/>
    <rect x="292" y="174" width="80" height="8" rx="2" fill="#FAF8F5" fill-opacity="0.4"/>
    <rect x="292" y="190" width="116" height="6" rx="2" fill="#BA5227"/>
  </g>

  <!-- Bottom metadata strip -->
  <g transform="translate(48, 442)">
    <text x="0" y="12" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.16em" fill="#D4AF37">ARCHITECTURE PREVIEW</text>
    <text x="170" y="12" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#B5A99B">• FLUTTER • DART • RIVERPOD • SPEECH RECOGNITION • FASTAPI</text>
  </g>
</svg>

