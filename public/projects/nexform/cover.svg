<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#15100E"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#E8E2D8" stroke-opacity="0.12"/>
  <defs>
    <pattern id="grid-nf" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FAF8F5" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#grid-nf)"/>

  <!-- Header -->
  <g transform="translate(48, 48)">
    <rect width="44" height="22" rx="4" fill="#BA5227" fill-opacity="0.2"/>
    <text x="22" y="15" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#E59368" text-anchor="middle">03</text>
    <text x="56" y="15" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.2em" fill="#FAF8F5" fill-opacity="0.5">INTERACTIVE 3D WEB APPLICATION</text>
    
    <text x="0" y="52" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="600" letter-spacing="0.04em" fill="#FAF8F5">NEXFORM</text>
    <text x="0" y="74" font-family="'Manrope', sans-serif" font-size="13" fill="#D6CEC2" fill-opacity="0.8">Real-Time Parametric 3D Product Customization Engine</text>
  </g>

  <!-- 3D Viewport Representation with Isometric Mesh Wireframe -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="600" height="270" rx="12" fill="#1C1512" stroke="#E8E2D8" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="0" y="0" width="600" height="32" rx="12" fill="#15100E"/>
    <circle cx="20" cy="16" r="4.5" fill="#BA5227"/>
    <circle cx="34" cy="16" r="4.5" fill="#D4AF37"/>
    <circle cx="48" cy="16" r="4.5" fill="#E8E2D8" fill-opacity="0.4"/>
    <text x="300" y="20" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#B5A99B" text-anchor="middle">WEBGL CANVAS [THREE.JS / SHADERMATERIAL]</text>

    <!-- Isometric 3D Wireframe Cube/Controller geometry -->
    <g transform="translate(240, 60)">
      <!-- 3D Coordinate Axis -->
      <path d="M60 140 L60 40 M60 140 L160 180 M60 140 L-40 180" stroke="#FAF8F5" stroke-opacity="0.15" stroke-width="1"/>
      <text x="65" y="45" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#BA5227">+Y</text>
      <text x="165" y="185" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#D4AF37">+X</text>
      <text x="-55" y="185" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#E8E2D8">+Z</text>

      <!-- Isometric Polygonal Mesh Geometry -->
      <!-- Top Face -->
      <polygon points="60,60 130,95 60,130 -10,95" fill="#BA5227" fill-opacity="0.25" stroke="#BA5227" stroke-width="1.5"/>
      <!-- Right Face -->
      <polygon points="60,130 130,95 130,165 60,200" fill="#D4AF37" fill-opacity="0.15" stroke="#D4AF37" stroke-width="1.5"/>
      <!-- Left Face -->
      <polygon points="60,130 -10,95 -10,165 60,200" fill="#15100E" fill-opacity="0.8" stroke="#E8E2D8" stroke-opacity="0.4" stroke-width="1.5"/>

      <!-- Parametric Nodes -->
      <circle cx="60" cy="60" r="4" fill="#FAF8F5"/>
      <circle cx="130" cy="95" r="4" fill="#FAF8F5"/>
      <circle cx="60" cy="130" r="5" fill="#BA5227"/>
      <circle cx="-10" cy="95" r="4" fill="#FAF8F5"/>
      <circle cx="60" cy="200" r="4" fill="#FAF8F5"/>
    </g>

    <!-- Right HUD Control Panel -->
    <g transform="translate(460, 48)">
      <rect x="0" y="0" width="124" height="200" rx="8" fill="#15100E" fill-opacity="0.8" stroke="#E8E2D8" stroke-opacity="0.1"/>
      <text x="14" y="24" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#D4AF37">SURFACE FINISH</text>
      <circle cx="22" cy="44" r="8" fill="#BA5227"/>
      <circle cx="44" cy="44" r="8" fill="#D4AF37"/>
      <circle cx="66" cy="44" r="8" fill="#8C827A"/>
      <circle cx="88" cy="44" r="8" fill="#1C1512" stroke="#FAF8F5"/>

      <text x="14" y="80" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#D4AF37">METALLIC / ROUGH</text>
      <rect x="14" y="92" width="96" height="4" rx="2" fill="#FAF8F5" fill-opacity="0.1"/>
      <rect x="14" y="92" width="64" height="4" rx="2" fill="#BA5227"/>

      <text x="14" y="126" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#D4AF37">FPS MONITOR</text>
      <text x="14" y="148" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#FAF8F5">60.0 FPS</text>
    </g>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(48, 442)">
    <text x="0" y="12" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="0.16em" fill="#BA5227">ARCHITECTURE PREVIEW</text>
    <text x="170" y="12" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#B5A99B">• THREE.JS • REACT THREE FIBER • GLSL • WEBGL • ZUSTAND</text>
  </g>
</svg>

