    <text x="162" y="70" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#B5A99B">ACTIVE ENROLLMENT</text>
    <text x="162" y="92" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#FAF8F5">1,240+</text>

    <rect x="295" y="50" width="135" height="54" rx="6" fill="#FAF8F5" fill-opacity="0.03" stroke="#E8E2D8" stroke-opacity="0.1"/>
    <text x="307" y="70" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#B5A99B">COMPLETION RATE</text>
    <text x="307" y="92" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#D4AF37">94.8%</text>

