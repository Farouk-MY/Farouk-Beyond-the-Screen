    <rect x="18" y="54" width="94" height="12" rx="3" fill="#D4AF37" fill-opacity="0.3"/>
    <rect x="18" y="76" width="70" height="8" rx="2" fill="#FAF8F5" fill-opacity="0.2"/>
    <rect x="18" y="96" width="80" height="8" rx="2" fill="#FAF8F5" fill-opacity="0.2"/>
    <rect x="18" y="116" width="65" height="8" rx="2" fill="#FAF8F5" fill-opacity="0.2"/>

